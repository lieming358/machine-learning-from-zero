name: Course quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install course dependencies
        run: python -m pip install -r requirements-course.txt
      - name: Validate lessons and examples
        run: python scripts/validate_course.py
